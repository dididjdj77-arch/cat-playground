name: ci

on:
  pull_request:
    paths:
      - "package.json"
      - "apps/**"
      - "packages/**"
      - "tests/**"
      - "docs/**"
      - "scripts/**"
      - "supabase/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Canonical verify
        run: npm run ci:verify

      - name: Public surface gate
        run: npm run ci:public-gate -- --require-exact

      - name: Drift gate
        run: npm run ci:drift
